<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña | Liceo AVB</title>

    <link rel="stylesheet" href="recuperar.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <main class="recovery-container">
      <section class="recovery-card">
        <header class="recovery-header">
          <div class="recovery-icon">
            <i class="fas fa-key"></i>
          </div>

          <h1>Recuperar contraseña</h1>

          <p>Intranet Liceo AVB</p>
        </header>

        <div class="recovery-body">
          <p class="recovery-description">
            ¿Olvidaste tu contraseña? No te preocupes. Ingresa tu RUT o usuario
            para solicitar ayuda para recuperar el acceso a tu cuenta.
          </p>

          <form id="recoveryForm">
            <div class="form-group">
              <label for="usuario">Usuario o RUT</label>

              <div class="input-wrap">
                <i class="fas fa-user"></i>

                <input
                  type="text"
                  id="usuario"
                  name="usuario"
                  placeholder="Ej: 12.345.678-9"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn-recovery">
              <i class="fas fa-paper-plane"></i>
              Solicitar recuperación
            </button>
          </form>

          <div id="mensaje" class="mensaje" role="status"></div>

          <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Volver al inicio de sesión
          </a>

          <div class="recovery-footer">
            ¿Necesitas ayuda?
            <a href="mailto:soporte@liceoavb.cl"> Contactar soporte TI </a>
          </div>
        </div>
      </section>
    </main>

    <script>
      document
        .getElementById("recoveryForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const usuario = document.getElementById("usuario").value.trim();
          const mensaje = document.getElementById("mensaje");

          if (usuario === "") {
            mensaje.textContent = "Por favor, ingresa tu usuario o RUT.";
            mensaje.className = "mensaje error";
            return;
          }

          mensaje.textContent =
            "Solicitud registrada visualmente. Para recuperar la contraseña, debes conectar esta página con el sistema de recuperación del liceo.";

          mensaje.className = "mensaje info";
        });
    </script>
  </body>
</html>
