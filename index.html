<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Intranet Liceo AVB</title>
  <link rel="icon" href="avb logo.jpg" type="image/png">

  <!-- CSS Principal -->
  <link rel="stylesheet" href="style.css">

  <!-- Fuente Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <main class="login-container">
    <section class="login-card">

      <header class="login-header">
        <button class="close-button" type="button" id="closeBtn" aria-label="Cerrar">
          <i class="fas fa-times"></i>
        </button>

        <div class="login-icon">
          <i class="fas fa-user-graduate"></i>
        </div>

        <h1>Intranet Liceo AVB</h1>
        <p>Acceso exclusivo para personal y estudiantes</p>
      </header>

      <!-- Mensaje de Alerta/Error Estilizado -->
      <div id="alertBox" class="alert-box" style="display: none;">
        <i id="alertIcon" class="fas"></i>
        <span id="alertText"></span>
      </div>

      <form class="login-form" id="loginForm">

        <div class="form-group">
          <label for="intraUser">Usuario o RUT</label>

          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input
              type="text"
              id="intraUser"
              name="usuario"
              placeholder="Ej: 12.345.678-9"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="intraPass">Contraseña</label>

          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="intraPass"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            >

            <button
              class="toggle-pass"
              type="button"
              id="togglePass"
              aria-label="Mostrar contraseña"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <a href="recuperar_contra.html" class="form-forgot">
          ¿Olvidaste tu contraseña?
        </a>

        <button type="submit" class="btn-login" id="btnLogin">
          <i class="fas fa-sign-in-alt"></i>
          <span>Iniciar sesión</span>
        </button>

        <div class="login-footer">
          ¿Problemas de acceso?
          <a href="mailto:soporte@liceoavb.cl">
            Contactar soporte TI
          </a>
        </div>

      </form>
    </section>
  </main>

  <!-- JavaScript separado -->
  <script src="script.js"></script>
</body>
</html>
